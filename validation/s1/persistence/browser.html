<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S1 persistence validation</title></head>
<body><h1>Persistence validation</h1><pre id="result">Running actual IndexedDB checks…</pre>
<script type="module">
import { runPersistenceScenarios } from './browser-scenarios.ts';
if (!new URLSearchParams(location.search).has('restore')) {
try { window.persistenceResult = await runPersistenceScenarios(); document.getElementById('result').textContent = JSON.stringify(window.persistenceResult, null, 2); }
catch (error) { window.persistenceFailure = { message: error.message, stack: error.stack }; document.getElementById('result').textContent = error.stack; }
}
</script></body></html>
